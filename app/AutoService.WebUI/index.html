<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" type="image/webp" href="/AppLogoFrameBlack.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/AppLogoFrameWhite.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060914" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="ARSM helps auto service teams schedule appointments, manage workload, and keep workshop operations organized." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, max-image-preview:none, max-snippet:0, max-video-preview:0" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, max-image-preview:none, max-snippet:0, max-video-preview:0" />
    <meta name="application-name" content="ARSM – Appointment and Resource Scheduling Management" />
    <meta property="og:title" content="ARSM – Appointment and Resource Scheduling Management" />
    <meta property="og:description" content="ARSM helps auto service teams schedule appointments, manage workload, and keep workshop operations organized." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="ARSM" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ARSM logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARSM – Appointment and Resource Scheduling Management" />
    <meta name="twitter:description" content="ARSM helps auto service teams schedule appointments, manage workload, and keep workshop operations organized." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="ARSM logo" />
    <title>ARSM – Appointment and Resource Scheduling Management</title>
  </head>
  <body>
    <!-- Static pre-React copy of the /login splash first frame (mobile LCP); kept in
      step with LoadingPage.tsx / src/utils/loginShell.ts. See app/AutoService.WebUI/CLAUDE.md. -->
    <div id="login-shell" aria-hidden="true" class="hidden">
      <main class="relative flex min-h-screen items-center justify-center overflow-hidden bg-arsm-surface px-3 pb-6 pt-24 text-arsm-primary dark:bg-arsm-deepest dark:text-arsm-primary-dark sm:px-4 sm:pb-8 sm:pt-8">
        <div class="arsm-auth-ambient pointer-events-none absolute left-1/2 top-1/2 z-0 h-[120vmax] w-[120vmax] -translate-x-1/2 -translate-y-1/2 rounded-full"></div>
        <div class="arsm-auth-sheen pointer-events-none absolute inset-0 z-0"></div>
        <div class="relative z-10 w-full max-w-[28rem] max-[320px]:max-w-[19.5rem]">
          <div class="relative overflow-hidden rounded-3xl border border-arsm-border bg-arsm-card/95 p-5 backdrop-blur-md dark:border-arsm-border-dark dark:bg-arsm-card-dark/95 max-[320px]:p-4 sm:p-8">
            <div class="mb-6 flex flex-col items-center text-center max-[320px]:mb-5 sm:mb-8">
              <div class="mt-1 flex items-center justify-center">
                <img src="/AppLogoFrameBlack.webp" alt="" width="789" height="662" fetchpriority="high" decoding="async" class="block h-20 w-auto select-none opacity-75 dark:hidden sm:h-24" />
                <img src="/AppLogoFrameWhite.webp" alt="" width="789" height="662" fetchpriority="high" decoding="async" class="hidden h-20 w-auto select-none opacity-75 dark:block sm:h-24" />
              </div>
            </div>
          </div>
        </div>
      </main>
      <div class="fixed inset-0 z-50 overflow-hidden bg-arsm-surface dark:bg-arsm-surface-dark">
        <div class="absolute inset-0 pointer-events-none hidden max-[320px]:block">
          <div class="arsm-loading-mobile-orb mobile-orb"></div>
        </div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="arsm-loading-logo-halo relative z-10 flex items-center justify-center rounded-full">
            <img src="/AppLogoFrameBlack.webp" alt="" width="789" height="662" draggable="false" fetchpriority="high" decoding="async" class="logo-spin opacity-70 select-none dark:hidden" />
            <img src="/AppLogoFrameWhite.webp" alt="" width="789" height="662" draggable="false" fetchpriority="high" decoding="async" class="logo-spin opacity-70 select-none hidden dark:block" />
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        if (window.location.pathname !== '/login') {
          return;
        }
        const shell = document.getElementById('login-shell');
        if (!shell) {
          return;
        }
        try {
          if (sessionStorage.getItem('autoservice-skip-loading-splash-on-next-boot') === '1') {
            return;
          }
          const savedTheme = localStorage.getItem('preferred-theme');
          document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        } catch {
          // Storage unavailable: keep the light default, exactly like the theme store.
        }
        shell.classList.remove('hidden');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
