version: 2
updates:
  - package-ecosystem: npm
    directory: /app/AutoService.WebUI
    schedule:
      interval: weekly
    ignore:
      # Babel 8 makes the React Compiler bail out on destructured defaults (WebUI CLAUDE.md).
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns:
          - "Aspire.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
