# Monthly, morning Budapest time: a merge to main auto-deploys the test instance and a WebUI PR runs the whole E2E suite.
# Minor and patch are grouped per ecosystem, a major is its own PR. Security updates ignore the schedule, limit and cooldown.

version: 2
updates:
  # Every project sits in app/AutoService.slnx, the unit tests included. Dependabot reads only `.config/dotnet-tools.json`,
  # so the root `dotnet-tools.json` (dotnet-ef, aspire.cli) stays a manual bump.
  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    # Same age rule as `.npmrc` and the dependency-upgrade skill.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The AppHost has one lock file per RID, regenerated together on each RID; Dependabot cannot do that.
      # `MessagePack` is only the AppHost's transitive pin over Aspire. Their alerts still show up.
      - dependency-name: "Aspire.*"
      - dependency-name: "MessagePack"
      # These majors follow the .NET major, pinned to net10.0.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/AutoService.WebUI
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    # `.npmrc` resolves nothing younger than 7 days, so a shorter cooldown would only fail the lock file update.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The type package follows the Node 26 runtime, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `@babel/core` stays on 7 for the React Compiler (app/AutoService.WebUI/CLAUDE.md).
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 and 7 run side by side for typescript-eslint; the dependency-upgrade skill moves each line by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript/*"
        update-types: ["version-update:semver-major"]

  # The workflows pin major tags (`@v7`), so in practice this entry opens major PRs only.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # Only literal `FROM` lines are watched. The tags in `AppHost.cs`, `tests.yml` and `deploy/local-test/deploy.py`
  # stay manual, and PostgreSQL needs a volume migration on a major anyway.
  - package-ecosystem: docker
    directories:
      - /deploy
      - /deploy/gate
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types:
          - minor
          - patch
    ignore:
      # The images stay on the runtimes the CI and the projects pin: Node 26 and .NET 10.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
