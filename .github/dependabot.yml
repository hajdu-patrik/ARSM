version: 2
updates:
  - package-ecosystem: npm
    directory: /app/AutoService.WebUI
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns:
          - "Aspire.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
