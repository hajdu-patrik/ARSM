name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below this push needs; the base is the last commit this workflow passed on,
  # so a change whose run was cancelled or failed is still covered by the next run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      webui: ${{ steps.diff.outputs.webui }}
      backend: ${{ steps.diff.outputs.backend }}
      api_suites: ${{ steps.diff.outputs.api_suites }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Select the jobs for the diff
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dotnet.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)"
        python3 scripts/ci-changes.py --base "$base" | tee -a "$GITHUB_OUTPUT"

  # Repository-wide size and no-shadow checks and the scripts test suite; build and lint run in the jobs below.
  repo-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Run repository gate
      run: python scripts/validate.py --all --skip-build

    - name: Run scripts tests
      run: python -m unittest discover -s tests/Scripts

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: app/**/packages.lock.json

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Restore .NET tools
      run: dotnet tool restore || dotnet tool restore

    - name: Verify EF migrations match the model
      run: dotnet tool run dotnet-ef -- migrations has-pending-model-changes --project AutoService.ApiService

    - name: Check NuGet vulnerabilities
      shell: bash
      run: |
        set -o pipefail
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
        ! grep -qi 'has the following vulnerable packages' vuln-report.txt

  frontend-build:
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/AutoService.WebUI
    # The production build requires the API origin (it goes into the CSP connect-src); CI only
    # checks that the bundle builds, so any valid https origin will do.
    env:
      VITE_API_URL: https://api.ci.invalid
      VITE_SITE_URL: https://app.ci.invalid

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'npm'
        cache-dependency-path: app/AutoService.WebUI/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify registry signatures
      run: npm audit signatures

    - name: Type-check
      run: npx tsc -b

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    # E2E specs sit outside every tsconfig, so this is the only gate that compiles them.
    - name: Verify E2E specs compile
      run: npx playwright test --list

    - name: Audit npm dependencies
      run: npm audit --audit-level=high