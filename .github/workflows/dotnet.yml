name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ARSM_EXECUTION_POLICY: local-cli-first

jobs:
  backend-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Restore .NET tools
      run: dotnet tool restore

    # Offline schema gate: fails when entities changed without a matching migration.
    - name: Verify EF migrations match the model
      run: dotnet tool run dotnet-ef -- migrations has-pending-model-changes --project AutoService.ApiService

    - name: Check NuGet vulnerabilities
      shell: bash
      run: |
        set -o pipefail
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
        ! grep -qi 'has the following vulnerable packages' vuln-report.txt

  frontend-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/AutoService.WebUI

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: app/AutoService.WebUI/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check
      run: npx tsc --noEmit

    - name: Audit npm dependencies
      run: npm audit --audit-level=high